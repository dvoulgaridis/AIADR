openapi: 3.1.0
info:
  title: AIADR API
  version: 0.1.0.dev0
  description: Contract for the local AI-Assisted Data Review application.
servers:
  - url: /api/v1
tags:
  - name: health
  - name: instruction-sets
  - name: uploads
  - name: sessions
  - name: events
  - name: exports
  - name: settings
  - name: audit
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      responses:
        "200":
          description: Application health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /instruction-sets:
    get:
      tags: [instruction-sets]
      operationId: listInstructionSets
      responses:
        "200":
          description: Valid portable instruction sets available to new sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructionSetsResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [instruction-sets]
      operationId: createInstructionSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstructionSetCreateRequest" }
      responses:
        "201":
          description: ID of the created instruction set.
          content:
            application/json:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
  /instruction-sets/{instruction_set_id}:
    parameters:
      - name: instruction_set_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [instruction-sets]
      operationId: getInstructionSet
      responses:
        "200":
          description: Editable instruction-set definition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstructionSetDefinition" }
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [instruction-sets]
      operationId: updateInstructionSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstructionSetUpdateRequest" }
      responses:
        "204":
          description: Instruction set replaced.
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [instruction-sets]
      operationId: deleteInstructionSet
      responses:
        "204":
          description: Instruction set removed from the catalogue.
        default:
          $ref: "#/components/responses/Error"
  /instruction-sets/{instruction_set_id}/active:
    parameters:
      - name: instruction_set_id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [instruction-sets]
      operationId: activateInstructionSet
      responses:
        "204":
          description: Instruction set selected for future analysis.
        default:
          $ref: "#/components/responses/Error"
  /uploads:
    post:
      tags: [uploads]
      operationId: uploadSource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Generated session ID for the created review session.
          content:
            application/json:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      responses:
        "200":
          description: Active review sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      responses:
        "200":
          description: Review session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [sessions]
      operationId: updateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdateRequest"
      responses:
        "204":
          description: Review session updated.
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [sessions]
      operationId: deleteSession
      responses:
        "204":
          description: Review session permanently purged.
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/source:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: downloadSource
      responses:
        "200":
          description: Original source bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/preview:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSourcePreview
      responses:
        "200":
          description: Browser preview bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/document/text-lines:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getDocumentTextLines
      responses:
        "200":
          description: Text lines extracted from the PDF displayed for the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTextLinesResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/document/docx/target:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: resolveDocxTextTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocxTextSelectionRequest"
      responses:
        "200":
          description: Canonical Open XML target corresponding to selected PDF text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocxTextLocator"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/document/docx/picture-placements:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getDocxPicturePlacements
      responses:
        "200":
          description: Renderer-derived PDF page placements for targetable DOCX pictures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocxPicturePlacementsResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/model-log:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getModelLogs
      description: >-
        Return model-call summaries. In development mode, debug fields may
        additionally contain sensitive request, response, and provider diagnostic
        text.
      responses:
        "200":
          description: Model-call summaries and optional development diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelLogsResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/analysis:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: requestAnalysis
      responses:
        "202":
          description: Analysis request accepted.
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/analysis/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: cancelAnalysis
      responses:
        "202":
          description: Analysis cancellation requested.
        "204":
          description: No active analysis.
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/findings:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: createManualFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualFindingCreateRequest"
      responses:
        "201":
          description: Generated layer ID for the created manual finding.
          content:
            application/json:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/findings/{finding_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/FindingId"
    patch:
      tags: [sessions]
      operationId: updateFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingUpdateRequest"
      responses:
        "204":
          description: Finding updated.
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/classification-options:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getClassificationOptions
      responses:
        "200":
          description: Entity types available from the session instruction set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationOptionsResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/layers:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getLayers
      responses:
        "200":
          description: Hydrated review layers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayersResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/layers/{layer_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/LayerId"
    put:
      tags: [sessions]
      operationId: updateLayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayerUpdateRequest"
      responses:
        "204":
          description: Layer updated.
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/layers/{layer_id}/effect-override:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/LayerId"
    delete:
      tags: [sessions]
      operationId: resetEffectOverride
      responses:
        "204":
          description: Layer restored to its instruction-set policy effect.
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/export:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [exports]
      operationId: createExport
      responses:
        "200":
          description: Created export bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportCreateResponse"
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/export/latest:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [exports]
      operationId: downloadLatestExport
      responses:
        "200":
          description: Latest export bundle.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/output:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [exports]
      operationId: downloadOutput
      responses:
        "200":
          description: Rendered redacted output.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [events]
      operationId: streamAnalysisEvents
      x-event-schema:
        $ref: "#/components/schemas/AnalysisEvent"
      responses:
        "200":
          description: Server-sent analysis events whose data is an AnalysisEvent JSON object.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/audit-events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [audit]
      operationId: getAuditEvents
      responses:
        "200":
          description: Session audit trail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsResponse"
        default:
          $ref: "#/components/responses/Error"
  /settings/models:
    get:
      tags: [settings]
      operationId: listModels
      responses:
        "200":
          description: Saved models and active selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
        default:
          $ref: "#/components/responses/Error"
  /settings/dependencies:
    get:
      tags: [settings]
      operationId: getDependencies
      responses:
        "200":
          description: Current availability of local media dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependenciesResponse"
        default:
          $ref: "#/components/responses/Error"
  /settings/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    put:
      tags: [settings]
      operationId: updateModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelWriteRequest"
      responses:
        "204":
          description: Model created or updated.
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [settings]
      operationId: deleteModel
      responses:
        "204":
          description: Model deleted.
        default:
          $ref: "#/components/responses/Error"
  /settings/models/{model_id}/model-metadata:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      tags: [settings]
      operationId: getModelModelMetadata
      responses:
        "200":
          description: Provider-reported metadata for the configured model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelMetadata"
        default:
          $ref: "#/components/responses/Error"
  /settings/models/{model_id}/active:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    put:
      tags: [settings]
      operationId: activateModel
      responses:
        "204":
          description: Model selected for future analysis.
        default:
          $ref: "#/components/responses/Error"
  /settings/review-options:
    get:
      tags: [settings]
      operationId: getReviewOptions
      responses:
        "200":
          description: Review decisions and supported redaction effects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewOptions"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    FindingId:
      name: finding_id
      in: path
      required: true
      schema: { type: string }
    LayerId:
      name: layer_id
      in: path
      required: true
      schema: { type: string }
    ModelId:
      name: model_id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Structured application error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, application_version, source_revision, source_modified]
      properties:
        status: { type: string, const: ok }
        application_version: { type: string }
        source_revision: { type: [string, "null"] }
        source_modified: { type: [boolean, "null"] }
    ErrorCategory:
      type: string
      enum: [validation, conflict, configuration, transport, processing, rendering, export, storage, internal]
    ErrorCode:
      type: string
      enum:
        - request_validation_failed
        - empty_update
        - unsupported_upload_type
        - file_too_large
        - text_line_too_large
        - unsafe_path
        - no_models
        - model_not_found
        - model_store_invalid
        - active_model_not_set
        - active_instruction_set_not_set
        - settings_store_invalid
        - model_endpoint_not_configured
        - token_count_failed
        - model_input_limit_exceeded
        - model_output_limit_exceeded
        - model_context_limit_exceeded
        - vision_not_supported
        - audio_not_supported
        - pdf_dependency_missing
        - ffmpeg_unavailable
        - prompt_missing
        - unsupported_prompt_kind
        - instruction_set_not_found
        - invalid_instruction_set
        - instruction_set_exists
        - instruction_set_conflict
        - instruction_set_not_locked
        - instruction_set_integrity_error
        - session_not_found
        - session_file_missing
        - source_integrity_error
        - analysis_already_running
        - provider_connection_failed
        - provider_model_not_found
        - provider_authentication_failed
        - provider_rate_limited
        - provider_request_invalid
        - provider_response_invalid
        - not_pdf_session
        - pdf_page_out_of_range
        - finding_not_found
        - layer_not_found
        - invalid_finding_update
        - invalid_layer_update
        - duplicate_finding_layer
        - invalid_action_effect
        - output_missing
        - output_state_changed
        - output_blocked_pending_review
        - audio_render_failed
        - export_missing
        - docx_processor_missing
        - docx_processor_busy
        - docx_unsupported_feature
        - docx_processing_failed
        - document_converter_missing
        - document_conversion_failed
        - invalid_docx_text_target
        - review_integrity_error
        - internal_error
    ErrorPayload:
      type: object
      additionalProperties: false
      required: [code, message, category, retryable, details, correlation_id]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        category: { $ref: "#/components/schemas/ErrorCategory" }
        retryable: { type: boolean }
        details:
          type: [object, "null"]
          additionalProperties: true
        correlation_id: { type: string }
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorPayload"
    SourceKind:
      type: string
      enum: [document, image, audio]
    SessionStatus:
      type: string
      enum: [uploaded, review_ready, error, cancelled]
    FileDescriptor:
      type: object
      additionalProperties: false
      required: [format, filename, mime_type, size_bytes, sha256]
      properties:
        format: { type: string }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    DocumentLayout:
      type: string
      enum: [text, fixed, word_processing]
    TextDocumentState:
      type: object
      additionalProperties: false
      required: [layout, line_count, character_count]
      properties:
        layout: { type: string, const: text }
        line_count: { type: integer, minimum: 0 }
        character_count: { type: integer, minimum: 0 }
    PdfDocumentState:
      type: object
      additionalProperties: false
      required: [layout, page_count]
      properties:
        layout: { type: string, const: fixed }
        page_count: { type: integer, minimum: 1 }
    DocxDocumentState:
      type: object
      additionalProperties: false
      required: [layout, block_count, character_count, page_count, targetable_image_count, unsupported_image_count]
      properties:
        layout: { type: string, const: word_processing }
        block_count: { type: integer, minimum: 0 }
        character_count: { type: integer, minimum: 0 }
        page_count: { type: integer, minimum: 1 }
        targetable_image_count: { type: integer, minimum: 0 }
        unsupported_image_count: { type: integer, minimum: 0 }
    DocumentState:
      oneOf:
        - $ref: "#/components/schemas/TextDocumentState"
        - $ref: "#/components/schemas/PdfDocumentState"
        - $ref: "#/components/schemas/DocxDocumentState"
      discriminator:
        propertyName: layout
        mapping:
          text: "#/components/schemas/TextDocumentState"
          fixed: "#/components/schemas/PdfDocumentState"
          word_processing: "#/components/schemas/DocxDocumentState"
    DocumentSource:
      type: object
      additionalProperties: false
      required: [kind, file, state]
      properties:
        kind: { type: string, const: document }
        file: { $ref: "#/components/schemas/FileDescriptor" }
        state: { $ref: "#/components/schemas/DocumentState" }
    ImageSource:
      type: object
      additionalProperties: false
      required: [kind, file, width, height]
      properties:
        kind: { type: string, const: image }
        file: { $ref: "#/components/schemas/FileDescriptor" }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    AudioSource:
      type: object
      additionalProperties: false
      required: [kind, file, duration_seconds, sample_rate]
      properties:
        kind: { type: string, const: audio }
        file: { $ref: "#/components/schemas/FileDescriptor" }
        duration_seconds: { type: number, exclusiveMinimum: 0 }
        sample_rate: { type: integer, minimum: 1 }
    Source:
      oneOf:
        - $ref: "#/components/schemas/DocumentSource"
        - $ref: "#/components/schemas/ImageSource"
        - $ref: "#/components/schemas/AudioSource"
      discriminator:
        propertyName: kind
        mapping:
          document: "#/components/schemas/DocumentSource"
          image: "#/components/schemas/ImageSource"
          audio: "#/components/schemas/AudioSource"
    Session:
      type: object
      additionalProperties: false
      required: [session_id, source, status, analysis_active, instruction_set, display_name, created_at, updated_at, rendered_file, public_error]
      properties:
        session_id: { type: string }
        source: { $ref: "#/components/schemas/Source" }
        status: { $ref: "#/components/schemas/SessionStatus" }
        analysis_active: { type: boolean }
        instruction_set:
          anyOf:
            - $ref: "#/components/schemas/InstructionSetReference"
            - type: "null"
        display_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        rendered_file:
          anyOf:
            - $ref: "#/components/schemas/FileDescriptor"
            - type: "null"
        public_error: { type: [string, "null"] }
    InstructionSetReference:
      type: object
      additionalProperties: false
      required: [id, content_hash]
      properties:
        id: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    InstructionSetSummary:
      type: object
      additionalProperties: false
      required: [id, name, content_hash]
      properties:
        id: { type: string }
        name: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    InstructionSetsResponse:
      type: object
      additionalProperties: false
      required: [items, active_instruction_set_id]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InstructionSetSummary" }
        active_instruction_set_id: { type: [string, "null"] }
    InstructionSetPrompts:
      type: object
      additionalProperties: false
      required: [text, document, image, audio]
      properties:
        text: { type: string, minLength: 1 }
        document: { type: string, minLength: 1 }
        image: { type: string, minLength: 1 }
        audio: { type: string, minLength: 1 }
    InstructionSetDefinition:
      type: object
      additionalProperties: false
      required: [id, name, content_hash, policy, prompts]
      properties:
        id: { type: string }
        name: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        policy:
          type: object
          additionalProperties: true
        prompts: { $ref: "#/components/schemas/InstructionSetPrompts" }
    InstructionSetCreateRequest:
      type: object
      additionalProperties: false
      required: [id, name, policy, prompts]
      properties:
        id: { type: string }
        name: { type: string }
        policy:
          type: object
          additionalProperties: true
        prompts: { $ref: "#/components/schemas/InstructionSetPrompts" }
    InstructionSetUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, expected_content_hash, policy, prompts]
      properties:
        name: { type: string }
        expected_content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        policy:
          type: object
          additionalProperties: true
