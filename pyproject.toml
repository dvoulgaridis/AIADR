[project]
name = "aiadr"
version = "0.1.0.dev0"
description = "AIADR – AI-Assisted Data Review: a local WebUI for instruction-set-driven personal-data review and redaction."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "anthropic>=0.120.2,<1",
  "google-genai>=1.75.0,<2",
  "openai>=2.44.0,<3",
  "fastapi>=0.138.2,<1",
  "uvicorn[standard]>=0.49.0,<1",
  "python-multipart>=0.0.32,<1",
  "pydantic>=2.13.4,<3",
  "pillow>=12.2.0,<13",
  "pypdfium2>=5.11.0,<6",
  "python-ulid>=3.1.0,<4",
  "pyyaml>=6,<7",
  "reportlab>=5.0.0,<6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.15.20,<1",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "anyio>=4.14.1,<5",
  "mypy>=2.1.0,<3",
  "datamodel-code-generator>=0.35,<1",
  "types-pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  "backend/src",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
